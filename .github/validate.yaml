name: Validate Blueprints

on:
  push:
    paths:
      - "blueprints/**/*.yaml"
      - ".github/validate.yaml"
  pull_request:
    paths:
      - "blueprints/**/*.yaml"
      - ".github/validate.yaml"

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate YAML syntax
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate all blueprint YAML files
        # Home Assistant uses custom YAML tags (!input, !secret, !include, etc.)
        # that pyyaml's SafeLoader doesn't know. We register a no-op constructor
        # for each tag so the loader can finish parsing the document and we
        # only fail on actual syntax errors.
        run: |
          import sys, yaml, pathlib

          class HALoader(yaml.SafeLoader):
              pass

          def _passthrough(loader, node):
              if isinstance(node, yaml.ScalarNode):
                  return loader.construct_scalar(node)
              if isinstance(node, yaml.SequenceNode):
                  return loader.construct_sequence(node)
              return loader.construct_mapping(node)

          for tag in ("!input", "!secret", "!include", "!include_dir_list",
                      "!include_dir_named", "!include_dir_merge_list",
                      "!include_dir_merge_named", "!env_var"):
              HALoader.add_constructor(tag, _passthrough)

          errors = []
          for f in pathlib.Path("blueprints").rglob("*.yaml"):
              try:
                  data = yaml.load(f.read_text(), Loader=HALoader)
                  bp = (data or {}).get("blueprint")
                  if not bp:
                      errors.append(f"❌ {f}: missing 'blueprint' top-level key")
                      continue
                  if "name" not in bp:
                      errors.append(f"❌ {f}: blueprint.name missing")
                      continue
                  if "domain" not in bp:
                      errors.append(f"❌ {f}: blueprint.domain missing")
                      continue
                  print(f"✅ {f}")
              except yaml.YAMLError as e:
                  errors.append(f"❌ {f}: {e}")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
        shell: python
