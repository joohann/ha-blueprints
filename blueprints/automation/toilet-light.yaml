blueprint:
  name: "Toilet Light - Door & Occupancy 🚽"
  description: >
    Smart toilet lighting based on a door sensor and occupancy sensor.

    Logic:
    - Light ON  → door opens
    - Light OFF → occupancy gone for X seconds (default 60s)
    - Light OFF → after absolute timeout regardless (default 30 min, fallback)

    Supports day / evening / bedtime brightness and color temperature modes.

    Uses mode: restart so each new door opening resets the wait timer,
    preventing "Already running" warnings when the toilet is used in
    quick succession.

  domain: automation
  homeassistant:
    min_version: "2024.6.0"

  input:
    door_sensor:
      name: Door sensor
      description: "Contact sensor of the toilet door (open/closed)"
      selector:
        entity:
          domain: binary_sensor
          device_class: door

    occupancy_sensor:
      name: Occupancy sensor
      description: "Occupancy sensor (mmWave radar) — occupied/not occupied"
      selector:
        entity:
          domain: binary_sensor
          device_class: occupancy

    light:
      name: Light
      description: "The toilet light entity"
      selector:
        entity:
          domain: light

    occupancy_timeout:
      name: Occupancy timeout (seconds)
      description: >
        How long must occupancy be gone before the light turns off?
        Recommended: 60 seconds.
      default: 60
      selector:
        number:
          min: 10
          max: 300
          step: 10
          unit_of_measurement: s

    absolute_timeout:
      name: Absolute timeout (minutes)
      description: >
        Light turns off after this many minutes regardless of occupancy.
        Acts as a safety fallback in case the occupancy sensor gets stuck.
        Recommended: 30 minutes.
      default: 30
      selector:
        number:
          min: 5
          max: 120
          step: 5
          unit_of_measurement: min

    evening_mode:
      name: Evening mode helper
      description: "input_boolean that indicates evening mode is active"
      selector:
        entity:
          domain: input_boolean

    bedtime_mode:
      name: Bedtime mode helper
      description: "input_boolean that indicates bedtime mode is active"
      selector:
        entity:
          domain: input_boolean

    default_brightness:
      name: Brightness (day)
      default: 100
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

    default_color_temp:
      name: Color temperature (day)
      default: 4000
      selector:
        color_temp:
          min: 1500
          max: 7000
          unit: kelvin

    evening_brightness:
      name: Brightness (evening)
      default: 60
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

    evening_color_temp:
      name: Color temperature (evening)
      default: 2700
      selector:
        color_temp:
          min: 1500
          max: 7000
          unit: kelvin

    bedtime_brightness:
      name: Brightness (bedtime)
      default: 5
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

    bedtime_color_temp:
      name: Color temperature (bedtime)
      default: 1500
      selector:
        color_temp:
          min: 1500
          max: 7000
          unit: kelvin

variables:
  evening_mode: !input evening_mode
  bedtime_mode: !input bedtime_mode
  default_brightness: !input default_brightness
  default_color_temp: !input default_color_temp
  evening_brightness: !input evening_brightness
  evening_color_temp: !input evening_color_temp
  bedtime_brightness: !input bedtime_brightness
  bedtime_color_temp: !input bedtime_color_temp

mode: restart

trigger:
  - trigger: state
    entity_id: !input door_sensor
    to: "on"
    id: door_open

action:
  # Step 1: turn light on with mode-appropriate settings
  - action: light.turn_on
    target:
      entity_id: !input light
    data:
      brightness_pct: >
        {% if is_state(bedtime_mode, 'on') %}
          {{ bedtime_brightness }}
        {% elif is_state(evening_mode, 'on') %}
          {{ evening_brightness }}
        {% else %}
          {{ default_brightness }}
        {% endif %}
      color_temp_kelvin: >
        {% if is_state(bedtime_mode, 'on') %}
          {{ bedtime_color_temp }}
        {% elif is_state(evening_mode, 'on') %}
          {{ evening_color_temp }}
        {% else %}
          {{ default_color_temp }}
        {% endif %}

  # Step 2: wait for occupancy gone for X seconds, with absolute timeout fallback
  - wait_for_trigger:
      - trigger: state
        entity_id: !input occupancy_sensor
        to: "off"
        for:
          seconds: !input occupancy_timeout
    timeout:
      minutes: !input absolute_timeout
    continue_on_timeout: true

  # Step 3: turn light off (either via occupancy gone or absolute timeout)
  - action: light.turn_off
    target:
      entity_id: !input light
