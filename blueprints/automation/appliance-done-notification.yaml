blueprint:
  name: "Appliance Done Notification 🏠"
  description: >
    Universal blueprint for sending a notification when an appliance has finished.
    Suitable for dishwasher, washing machine, dryer, or any other appliance with
    a power sensor.

    How it works:
    - Step 1: the blueprint waits until the appliance has been continuously
      active (above the minimum-active wattage for the minimum duration).
      Only then does it open a "really running" session.
    - Step 2: once the power then drops below the threshold and stays there
      stably, a notification is sent. Up to 3 times in total with a delay
      in between, until you tap '✅ Done' in the notification or the retry
      limit is reached.
    - Brief on/off blips or sub-minimum-duration dips do not produce
      a notification.
    - mode: restart — if the appliance ramps back up during step 1 or 2,
      the watch is restarted from scratch.

    Threshold starting points by appliance type:
    - Washing machine: active ±50–2300W → threshold 5W,  stability 360s
    - Dryer:           active ±50–2900W → threshold 5W,  stability 180s, min_active 100W
    - Dishwasher:      active ±60–2200W → threshold 5W,  stability 180s

  domain: automation
  homeassistant:
    min_version: "2024.6.0"
  input:
    power_sensor:
      name: Power sensor
      description: "The sensor measuring power consumption (in Watt)"
      selector:
        entity:
          domain: sensor
          device_class: power

    threshold_watt:
      name: Threshold (Watt)
      description: >
        Below which wattage is the appliance considered 'done'?
        Recommended: 5W (prevents false alerts from standby consumption).
      default: 5
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: W

    stability_seconds:
      name: Stability duration (seconds)
      description: >
        How long must power stay below the threshold before alerting?
        Dishwasher & dryer: 180s. Washing machine: 360s (longer soak phases).
      default: 180
      selector:
        number:
          min: 10
          max: 600
          step: 10
          unit_of_measurement: s

    min_active_watt:
      name: Minimum active power (Watt)
      description: >
        From which wattage is the appliance considered 'active'?
        Prevents standby consumption from accidentally starting a session.
        Dishwasher & washing machine: 50W. Dryer: 100W.
      default: 50
      selector:
        number:
          min: 10
          max: 500
          step: 5
          unit_of_measurement: W

    min_active_duration:
      name: Minimum active duration (seconds)
      description: >
        How long must the appliance run continuously above the minimum
        active wattage before we consider the session valid?
        Prevents alerts from briefly toggling the appliance on by accident.
        Recommended: 600 seconds (10 minutes).
      default: 600
      selector:
        number:
          min: 60
          max: 3600
          step: 60
          unit_of_measurement: s

    notification_message:
      name: Notification message
      description: "The body text of the first notification."
      default: "The appliance is done ✅"
      selector:
        text:

    notification_title:
      name: Notification title
      description: "The title of the notification."
      default: "Appliance done 🏠"
      selector:
        text:

    reminder_message:
      name: Reminder message
      description: >
        Body text for repeated reminders (after 15 min, 30 min, ...).
        The first notification uses 'Notification message' above.
      default: "Don't forget your laundry 🙂"
      selector:
        text:

    reminder_count:
      name: Number of reminders
      description: >
        How many times to remind you again if you don't tap '✅ Done'.
        With 2 you get 3 notifications total (the first + 2 reminders).
      default: 2
      selector:
        number:
          min: 0
          max: 5
          step: 1
          unit_of_measurement: times

    reminder_interval_minutes:
      name: Interval between reminders (minutes)
      description: >
        How long to wait before reminding again.
        Recommended: 15 minutes.
      default: 15
      selector:
        number:
          min: 1
          max: 120
          step: 1
          unit_of_measurement: min

    notify_devices:
      name: Devices to notify
      description: >
        The mobile devices that receive the notification.
        Multiple devices can be selected — when one taps '✅ Done' the
        reminders stop on all devices.
      selector:
        device:
          integration: mobile_app
          multiple: true

# restart so a fresh activation during the waiting phase resets the watch
# instead of being silently dropped (which 'single' mode would do).
mode: restart
max_exceeded: silent

# ---------------------------------------------------------------------------
# Step 1 — open a session as soon as the appliance has been running
# continuously above 'min_active_watt' for 'min_active_duration'.
# This trigger acts as a gatekeeper; only after it fires do we start
# watching for the end of the cycle.
# ---------------------------------------------------------------------------
trigger:
  - trigger: numeric_state
    entity_id: !input power_sensor
    above: !input min_active_watt
    for:
      seconds: !input min_active_duration

# Variables we need in the action block.
# - done_action_id: a unique action ID per run (tied to context.id) so that
#   parallel automations don't react to each other's button taps.
# - notify_tag: a shared tag across all devices so we can clear the
#   notification with a single service call when someone taps Done.
variables:
  reminder_interval_minutes: !input reminder_interval_minutes
  reminder_count: !input reminder_count
  notification_message: !input notification_message
  notification_title: !input notification_title
  reminder_message: !input reminder_message
  notify_devices: !input notify_devices
  done_action_id: "DONE_{{ context.id }}"
  notify_tag: "appliance_done_{{ context.id }}"

action:
  # ---------------------------------------------------------------------------
  # Step 2 — wait until power drops below the threshold and stays there.
  # wait_for_trigger blocks this run instance until the condition holds,
  # without polling.
  #
  # timeout: 12 hours — guards against sensors that never reach 0 (e.g. a
  # stuck reading). continue_on_timeout: false ensures we don't notify
  # when the timeout fires instead of the trigger.
  # ---------------------------------------------------------------------------
  - wait_for_trigger:
      - trigger: numeric_state
        entity_id: !input power_sensor
        below: !input threshold_watt
        for:
          seconds: !input stability_seconds
    timeout:
      hours: 12
    continue_on_timeout: false

  # Safety net: only continue if the wait trigger actually fired.
  - condition: template
    value_template: "{{ wait.trigger is not none }}"

  # ---------------------------------------------------------------------------
  # Step 3 — notification loop: send 1 + N reminders, or stop when the user
  # taps '✅ Done' on the notification.
  #
  # repeat.until evaluates AFTER each iteration. We stop when either the
  # max number of attempts is reached, or the user has tapped (detected
  # via wait.trigger in the inner wait_for_trigger).
  # ---------------------------------------------------------------------------
  - repeat:
      sequence:
        # Send notification to each selected device. A fresh repeat over the
        # target devices on each outer iteration.
        - repeat:
            for_each: "{{ notify_devices }}"
            sequence:
              - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                data:
                  title: "{{ notification_title }}"
                  # First run = notification_message, reminders = reminder_message.
                  message: >-
                    {% if repeat.index == 1 %}
                      {{ notification_message }}
                    {% else %}
                      {{ reminder_message }}
                    {% endif %}
                  data:
                    # Tag so subsequent notifications replace the previous one
                    # instead of stacking, and so we can clear it later.
                    tag: "{{ notify_tag }}"
                    # iOS + Android — actionable notification with one button.
                    actions:
                      - action: "{{ done_action_id }}"
                        title: "✅ Done"

        # Wait either until the user taps, or until the reminder interval
        # elapses. continue_on_timeout: true so on timeout we proceed to
        # the next iteration and notify again.
        - wait_for_trigger:
            - trigger: event
              event_type: mobile_app_notification_action
              event_data:
                action: "{{ done_action_id }}"
          timeout:
            minutes: "{{ reminder_interval_minutes }}"
          continue_on_timeout: true

      # Stop when:
      #   1. the user has tapped (wait.trigger is then populated), OR
      #   2. we have sent the maximum number of notifications.
      # repeat.index counts from 1 and is the number of completed iterations.
      until: >-
        {{ wait.trigger is not none
           or repeat.index > reminder_count }}

  # Clear the notification on all devices when the user has tapped — so it
  # doesn't linger as 'unread' on the other phones. This works via the same
  # tag we set on every notification.
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ wait.trigger is not none }}"
        sequence:
          - repeat:
              for_each: "{{ notify_devices }}"
              sequence:
                - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                  data:
                    message: clear_notification
                    data:
                      tag: "{{ notify_tag }}"
